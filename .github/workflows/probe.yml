# Put one feed through Gazette's article path — the parser keeping each
# item's body whole, the extractor laying it out, the portable C the Mac
# runs — and print what the reader pane will show for every item. Run by
# hand from the Actions tab, or `gh workflow run probe.yml -f feed=<url>`.
# The feed it fetched is kept as an artifact, to become a host-test fixture
# when a rule comes of it.
name: Probe a feed

on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Feed URL"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the probe
        run: make -C tests/host probe

      - name: Probe
        env:
          FEED: ${{ inputs.feed }}
        run: bash tools/probe.sh "$FEED" probe-out

      - name: Keep the pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-feed
          path: probe-out/
