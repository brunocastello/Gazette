# Gazette — GitHub Actions CI Workflow (Win32, MinGW cross-compile)
#
# The second of two build workflows. build.yml makes the Carbon PPC
# application for Mac OS 9; this one makes the single 32-bit executable
# that runs on Windows 95, 98, Me, NT 4.0, 2000 and XP, and the floppy
# image it is tested from.
#
# It is a separate file rather than a job in build.yml because it shares
# nothing with the Retro68 container: a different toolchain, a different
# shell and a different set of assets. The host tests that gate the
# Carbon build gate this one too -- they run on every push in build.yml,
# over the same portable modules this executable links.

name: Build Gazette (Win32)

on:
  push:
    # Both filters, for the same reason build.yml gives: naming tags
    # alone would silently stop every branch build.
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'src/win/**'
      - 'src/app/**'
      - 'src/portable/**'
      - 'src/prefs/**'
      - 'src/feeds/**'
      - 'src/extract/**'
      - 'src/net/**'
      - 'src/store/**'
      - 'src/core/**'
      - 'third_party/certainly/**'
      - 'third_party/stb/**'
      - 'tests/win/**'
      - 'Resources/win/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/make_img.sh'
      - 'installer/**'
      - 'LICENSE'
      - 'src/gazette_version.h'
      - 'docs/release-notes.md'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/win/**'
      - 'src/app/**'
      - 'src/portable/**'
      - 'src/prefs/**'
      - 'src/feeds/**'
      - 'src/extract/**'
      - 'src/net/**'
      - 'src/store/**'
      - 'src/core/**'
      - 'third_party/certainly/**'
      - 'third_party/stb/**'
      - 'tests/win/**'
      - 'Resources/win/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/make_img.sh'
      - 'installer/**'
      - 'LICENSE'
      - 'src/gazette_version.h'
      - 'docs/release-notes.md'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only used by the release step, on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the MinGW cross-toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # The -win32 packages are the Win32-threads flavour of the
          # compiler. The -posix one links libwinpthread-1.dll, and a
          # DLL beside the executable is the one thing a single-file
          # application for these machines must not need.
          #
          # mtools writes the floppy image without root and without a
          # loop mount; zip makes the archive; nsis builds the installer.
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 \
            g++-mingw-w64-i686-win32 \
            binutils-mingw-w64-i686 \
            mtools \
            zip \
            nsis

      - name: Configure
        run: |
          cmake -S . -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-win --verbose

      - name: Inspect the executable
        run: |
          set -euo pipefail

          # Two things this proves, and neither of them can be checked
          # from a Mac or a Linux box any other way:
          #
          #   The subsystem version. 4.00 is what a Windows 95 or NT 4
          #   loader requires; MinGW's default is later, and a binary
          #   stamped with it is refused before it runs.
          #
          #   The import table. Every name here has to exist on a plain
          #   Windows 95 -- no libwinpthread, no libgcc, and no
          #   comctl32, which the shell loads by hand precisely so that
          #   it does not appear in this list.
          i686-w64-mingw32-objdump -p build-win/Gazette.exe \
            | grep -E 'Magic|MajorSubsystemVersion|MinorSubsystemVersion|MajorOperatingSystemVersion|Subsystem'

          echo "DLLs imported:"
          i686-w64-mingw32-objdump -p build-win/Gazette.exe \
            | grep -i 'DLL Name'

          # And what must never be imported, now that TLS and Winsock are
          # in: Winsock 2 (a separate download on Windows 95), CryptoAPI
          # (OSR2 / IE 3.02 and later -- PATCHES.md §25), and the comctl32
          # entry point after 4.0. Any of them and a plain Windows 95
          # refuses to load the file.
          imports="$(i686-w64-mingw32-objdump -p build-win/Gazette.exe)"
          for banned in WS2_32 CryptAcquireContext CryptGenRandom \
                        InitCommonControlsEx libwinpthread libgcc_s; do
            if echo "$imports" | grep -qi "$banned"; then
              echo "::error::Gazette.exe imports $banned"
              exit 1
            fi
          done
          echo "No import newer than Windows 95 found."

          ls -l build-win/Gazette.exe

          # Where the bytes are: the section table, and the largest
          # symbols in what was linked. Gazette has to fit a 1.44 MB
          # floppy (tools/make_img.sh), and this is the first place to
          # look when it stops fitting.
          i686-w64-mingw32-objdump -h build-win/Gazette.exe
          find build-win -name '*.a' -o -name '*.obj' \
            | xargs i686-w64-mingw32-nm -S 2>/dev/null \
            | awk 'NF == 4 { print $2, $3, $4 }' | sort | tail -25

      - name: Install Wine (32-bit)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine32:i386 wine

      - name: Fetch live feeds through the Windows network path
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          set -euo pipefail
          # GazetteNetTest is the application's own fetch over Winsock and
          # Certainly, run under Wine against real servers:
          #   news.google.com  -- TLS 1.3, Certainly's own handshake, and a
          #                        feed that parses
          #   feeds.nbcnews.com -- a second RSS host
          #   www.nbcnews.com  -- TLS 1.2 only, BearSSL's engine
          #                        (PATCHES.md §24)
          #   9to5mac.com/feed -- chunked, redirects
          wineboot --init >/dev/null 2>&1 || true
          wine build-win/GazetteNetTest.exe \
            "https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en" \
            "https://feeds.nbcnews.com/nbcnews/public/news" \
            "https://www.nbcnews.com/" \
            "https://9to5mac.com/feed/"

      # Under a virtual display: the test also opens File > Import Feeds'
      # and Export Feeds' Open and Save dialogs and answers them, which a
      # console program cannot do with nowhere to draw.
      - name: The Windows file store, under Wine
        env:
          WINEDEBUG: -all
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a wine build-win/GazetteStoreTest.exe

      - name: The whole engine, under Wine (core, refresh, cache, read state)
        env:
          WINEDEBUG: -all
        run: |
          # In a folder of its own, so the first run's preferences are
          # written fresh, as on a new machine.
          mkdir -p enginetest && cp build-win/GazetteEngineTest.exe enginetest/
          wine enginetest/GazetteEngineTest.exe
          # And again: a second launch reads what the first one saved.
          wine enginetest/GazetteEngineTest.exe | tee second.txt
          grep -q "read from the file" second.txt

      # NSIS, as Gateway's installer is built: the ANSI stub, since the
      # Unicode one will not load on 95, 98 or Me. Built on every push, not
      # only on a tag -- an asset that is only made during a release is one
      # whose first test is the release.
      - name: Build the installer
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^#define GAZETTE_VERSION_STRING "\(.*\)"/\1/p' \
                    src/gazette_version.h)
          echo "Gazette $VERSION"
          sed 's/$/\r/' installer/README.TXT > build-win/README.TXT
          sed 's/$/\r/' LICENSE              > build-win/LICENSE.TXT
          makensis -V2 -DVERSION="$VERSION" -DSRC=../build-win \
                   installer/gazette.nsi
          mv installer/Setup.exe build-win/Setup.exe
          ls -l build-win/Setup.exe

      - name: Will the installer run on Windows 95
        run: |
          set -euo pipefail
          i686-w64-mingw32-objdump -p build-win/Setup.exe \
            | grep -E 'MajorSubsystemVersion|MinorSubsystemVersion|Subsystem'
          echo "DLLs imported:"
          i686-w64-mingw32-objdump -p build-win/Setup.exe | grep -i 'DLL Name'

      - name: Package the .zip and the floppy .img
        run: tools/make_img.sh build-win/Gazette.exe package build-win/Setup.exe

      - name: Upload the installer, archive and disk image
        uses: actions/upload-artifact@v6
        with:
          name: Gazette-win32
          path: |
            build-win/Gazette.exe
            build-win/Setup.exe
            package/Gazette.zip
            package/Gazette.img
          if-no-files-found: error

      # A tag's build becomes the Windows half of the release. The Mac's
      # build.yml makes the same release from the same tag, and either may
      # finish first: whichever arrives first creates it with the notes,
      # and the other adds its files. --clobber makes a re-run refresh them.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp package/Gazette.zip "release/Gazette-${GITHUB_REF_NAME}-windows.zip"
          cp package/Gazette.img "release/Gazette-${GITHUB_REF_NAME}-windows.img"
          cp build-win/Setup.exe "release/Gazette-${GITHUB_REF_NAME}-windows-setup.exe"

          for attempt in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "Gazette $GITHUB_REF_NAME" \
                --notes-file docs/release-notes.md
              break
            fi
            sleep 20
          done

          gh release upload "$GITHUB_REF_NAME" --clobber \
            "release/Gazette-${GITHUB_REF_NAME}-windows.zip" \
            "release/Gazette-${GITHUB_REF_NAME}-windows.img" \
            "release/Gazette-${GITHUB_REF_NAME}-windows-setup.exe"
