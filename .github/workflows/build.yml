# Gazette — GitHub Actions CI Workflow (Carbon PPC for Mac OS 9)

name: Build Gazette (Carbon PPC)

on:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'third_party/InterfacesAndLibraries/**'
      - 'third_party/AUI/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'third_party/InterfacesAndLibraries/**'
      - 'third_party/AUI/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Retro68 (Carbon / PowerPC toolchain)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/Gazette" \
            -w /root/Gazette \
            -i ghcr.io/autc04/retro68 /bin/bash <<'EOF'
          set -euo pipefail

          TOOLCHAIN=/Retro68-build/toolchain
          IAL=/Retro68-build/bin/interfaces-and-libraries.sh

          # Stage Apple's Universal Interfaces (PPC only, no Carbon — MPW 3.5).
          # This gives us Classic Toolbox headers for Mac OS 9.
          "$IAL" "$TOOLCHAIN" /root/Gazette/third_party/InterfacesAndLibraries false true false

          # Stage Apple Universal Interfaces (Carbon headers — Carbon.h, etc.).
          # AUI was released with Mac OS X and includes the Carbon framework headers.
          "$IAL" "$TOOLCHAIN" /root/Gazette/third_party/AUI/Universal/Interfaces false true true

          # Verify Carbon headers are available
          test -f "$TOOLCHAIN/powerpc-apple-macos/include/Carbon/Carbon.h"

          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake
          cmake --build . --verbose
          ls -la
          EOF

      - name: Package release assets (.sit archive)
        run: |
          set -euo pipefail

          # build/ is owned by root (created inside the Retro68 container),
          # so this host-side step can read from it but not write new
          # files into it -- everything created here goes to package/
          # instead, which this step owns.
          mkdir -p package

          git clone --depth 1 https://github.com/thecloudexpanse/sit.git /tmp/sit-src
          make -C /tmp/sit-src

          # sit reads AppleDouble sidecars named "._name" on Linux; Rez
          # already wrote the resource-fork half as "%Gazette.ad" (its own
          # AppleDouble naming convention) and the plain data fork as
          # "Gazette.ad" -- just rename both into place.
          cp build/Gazette.ad package/Gazette
          cp "build/%Gazette.ad" package/._Gazette
          /tmp/sit-src/sit -T APPL -C Gzt9 -o package/Gazette.sit package/Gazette

      - name: Upload disk image + app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-carbon-ppc-macos9
          path: |
            build/Gazette.dsk
            build/Gazette.APPL
            build/Gazette.bin
            package/Gazette.sit
          if-no-files-found: error
