# Gazette — GitHub Actions CI Workflow (Carbon PPC for Mac OS 9)

name: Build Gazette (Carbon PPC)

on:
  push:
    paths:
      - 'src/**'
      - 'Resources/**'
      - 'CMakeLists.txt'
      - 'third_party/AUI/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Resources/**'
      - 'CMakeLists.txt'
      - 'third_party/AUI/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  # The portable modules — the prefs grammar, the feed parsing and the ASCII
  # transliteration — carry no system headers, so they are tested with a plain
  # Linux cc in seconds. This job runs first because a failure here is a real
  # failure, whereas a Retro68 break is usually a toolchain question.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host tests
        run: make -C tests/host

  build:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Retro68 (Carbon / PowerPC toolchain)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/Gazette" \
            -w /root/Gazette \
            -i ghcr.io/autc04/retro68 /bin/bash <<'EOF'
          set -euo pipefail

          TOOLCHAIN=/Retro68-build/toolchain
          IAL=/Retro68-build/bin/interfaces-and-libraries.sh
          AUI=/root/Gazette/third_party/AUI/Universal
          PPC_INCLUDE="$TOOLCHAIN/powerpc-apple-macos/include"
          RINCLUDES="$TOOLCHAIN/powerpc-apple-macos/RIncludes"

          # interfaces-and-libraries.sh stages Apple's headers by symlinking each
          # one into the toolchain's include directory. Its prepare-headers.sh
          # deliberately whitelists Apple's fenv.h -- "newlib does not provide
          # fenv.h, so use Apple's" -- but the newlib in the current Retro68
          # image *does* ship one, as a real file rather than a symlink. The
          # script only unlinks symlinks before restaging, so the real file
          # survives and the symlink fails with
          #     ln: failed to create symbolic link './fenv.h': File exists
          # aborting the whole staging step. Delete newlib's copy first: the
          # script's own rule is that the universal interfaces get right of way.
          rm -f "$PPC_INCLUDE/fenv.h"

          # Stage Apple's Universal Interfaces (Carbon headers -- Carbon.h etc.).
          # Arguments: <toolchain> <interfaces dir> <68k> <ppc> <carbon>.
          # AUI covers the whole Classic Toolbox as well as Carbon, so MPW 3.5
          # is not needed. Pass Universal/ so the script finds Carbon.h and
          # CarbonLib below it.
          "$IAL" "$TOOLCHAIN" "$AUI" false true true

          # Headers are linked flat into the include directory, so the umbrella
          # header is <Carbon.h> -- there is no Carbon/ subdirectory.
          test -f "$PPC_INCLUDE/Carbon.h"
          test -f "$PPC_INCLUDE/MacWindows.h"
          test -f "$RINCLUDES/Dialogs.r"
          test -f "$RINCLUDES/Processes.r"

          # The photographs link against QuickTimeLib; the staging script
          # makes an import library from Apple's stub for every library it
          # finds, and this is where it puts them.
          echo "Import libraries:"
          ls "$TOOLCHAIN/powerpc-apple-macos/lib" | grep -i 'QuickTime\|CarbonLib' || true

          # Retro68's own Rez templates must survive alongside Apple's RIncludes;
          # add_application() rezzes the app against RetroCarbonAPPL.r.
          echo "Retro68 Rez templates:"
          ls "$RINCLUDES" | grep -i 'APPL\.r$' || echo "  (none found -- Rez will fail)"

          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake"
          cmake --build build --verbose

          ls -la build
          EOF

      - name: Package release assets (.sit archive)
        run: |
          set -euo pipefail

          # build/ is owned by root (created inside the Retro68 container),
          # so this host-side step can read from it but not write new
          # files into it -- everything created here goes to package/
          # instead, which this step owns.
          mkdir -p package

          git clone --depth 1 https://github.com/thecloudexpanse/sit.git /tmp/sit-src
          make -C /tmp/sit-src

          # sit reads AppleDouble sidecars named "._name" on Linux; Rez
          # already wrote the resource-fork half as "%Gazette.ad" (its own
          # AppleDouble naming convention) and the plain data fork as
          # "Gazette.ad" -- just rename both into place.
          cp build/Gazette.ad package/Gazette
          cp "build/%Gazette.ad" package/._Gazette
          /tmp/sit-src/sit -T APPL -C Gzt9 -o package/Gazette.sit package/Gazette

      - name: Upload disk image + app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-carbon-ppc-macos9
          path: |
            build/Gazette.dsk
            build/Gazette.APPL
            build/Gazette.bin
            package/Gazette.sit
          if-no-files-found: error
