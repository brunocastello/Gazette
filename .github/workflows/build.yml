# Gazette — GitHub Actions CI Workflow (PPC-focused)

name: Build Gazette (Carbon PPC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel redundant builds on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------------ #
# Jobs                                                                #
# ------------------------------------------------------------------ #

jobs:
  # ================================================================== #
  # Carbon PPC build — Mac OS X (PowerPC)                             #
  # ================================================================== #

  carbon-ppc-build:
    name: Carbon PPC Build (macOS ${{ matrix.os-version }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 11 (Big Sur) — last GitHub Actions runner with Carbon framework
          - runner: macos-11
            os-version: "11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version (Carbon-compatible)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "13.4.2"  # Last Xcode with Carbon support on macOS 11

      - name: Install CMake
        uses: lukka/get-cmake@v3.28.1

      - name: Configure CMake (PPC only)
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_OSX_ARCHITECTURES="ppc" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Gazette (PPC)
        run: |
          cd build
          make -j$(nproc)

      - name: Upload PPC artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-carbon-ppc-macos11
          path: build/Gazette
          if-no-files-found: warn

  # ================================================================== #
  # Classic Mac OS 9 PPC build (via Retro68 cross-compiler)           #
  # ================================================================== #

  os9-ppc-build:
    name: Classic Mac OS 9 PPC Build (Retro68)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Retro68 toolchain
        run: |
          git clone --depth 1 https://github.com/retro68/retro68.git ~/retro68
          cd ~/retro68
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/.retro68
          make -j$(nproc)
          sudo make install

      - name: Install CMake
        uses: lukka/get-cmake@v3.28.1

      - name: Configure CMake (Retro68 PPC)
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/.retro68/share/retro68/cmake/Modules/Platform/Darwin.cmake \
            -DCMAKE_C_COMPILER=retrocc \
            -DCMAKE_CXX_COMPILER=retroc++

      - name: Build Gazette (Classic Mac OS 9 PPC)
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Classic Mac OS 9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-os9-ppc-retro68
          path: build/Gazette
