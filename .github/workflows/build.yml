# Gazette — GitHub Actions CI Workflow

name: Build Gazette (Carbon)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel redundant builds on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------------ #
# Jobs                                                                #
# ------------------------------------------------------------------ #

jobs:
  # ================================================================== #
  # Carbon build — Mac OS 9 / Mac OS X (Carbon available)             #
  # ================================================================== #

  carbon-build:
    name: Carbon Build (macOS ${{ matrix.os-version }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 11 (Big Sur) — last GitHub Actions runner with Carbon framework
          - runner: macos-11
            os-version: "11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version (Carbon-compatible)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "13.4.2"  # Last Xcode with Carbon support on macOS 11

      - name: Install CMake
        uses: lukka/get-cmake@v3.28.1

      - name: Configure CMake (Carbon)
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Gazette (Carbon)
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Carbon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-carbon-macos11
          path: build/Gazette
          if-no-files-found: warn

  # ================================================================== #
  # Portable build — Linux (host tests only, no Carbon needed)          #
  # ================================================================== #

  portable-build:
    name: Portable Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++

      - name: Configure CMake (portable)
        run: |
          mkdir build && cd build
          cmake ..

      - name: Build host tests (portable)
        run: |
          cd build
          make -j$(nproc) host_tests

      - name: Run host tests
        run: |
          cd build
          ./host_tests

      - name: Upload portable test binary
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-host-tests-linux
          path: build/host_tests

  # ================================================================== #
  # Universal Binary — ppc + x86_64 (Carbon, macOS 11)                  #
  # ================================================================== #

  universal-build:
    name: Universal Binary (ppc + x86_64)
    runs-on: macos-11

    needs: carbon-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version (Carbon-compatible)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "13.4.2"

      - name: Install CMake
        uses: lukka/get-cmake@v3.28.1

      - name: Configure CMake (Universal Binary)
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_OSX_ARCHITECTURES="ppc;x86_64" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Universal Binary
        run: |
          cd build
          make -j$(nproc)

      - name: Verify architecture (lipo)
        run: |
          cd build
          lipo -info Gazette || echo "lipo not available, skipping verification"

      - name: Upload Universal Binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gazette-universal-macos11
          path: build/Gazette
